---
- name: Rulebook activation integration tests for state handling
  module_defaults:
    group/ansible.eda.eda:
      aap_hostname: "{{ aap_hostname }}"
      aap_username: "{{ aap_username }}"
      aap_password: "{{ aap_password }}"
      aap_validate_certs: "{{ aap_validate_certs }}"
  block:
    - name: Generate a random_string for the test
      set_fact:
        random_string: "{{ lookup('password', '/dev/null chars=ascii_letters length=16') }}"
      when: random_string is not defined

    - name: Generate a ID for the test
      set_fact:
        test_id: "{{ random_string | to_uuid }}"
      when: test_id is not defined

    - name: Define variables for the state tests
      set_fact:
        organization_name: "Default"
        decision_env_name: "Test_State_Decision_Env_{{ test_id }}"
        activation_name: "Test_State_Activation_{{ test_id }}"
        project_name: "Test_State_Project_{{ test_id }}"
        de_image_url: "quay.io/ansible/ansible-rulebook:main"
        scm_url: https://github.com/ansible/eda-sample-project.git
        rulebook_name: "range_long_running.yml"

    - name: Create a new project
      ansible.eda.project:
        name: "{{ project_name }}"
        url: "{{ scm_url }}"
        organization_name: "{{ organization_name }}"
        state: present

    - name: Wait for the project to be imported
      register: project_status
      until: project_status.projects[0].import_state == "completed"
      retries: 30
      delay: 2
      ansible.eda.project_info:
        name: "{{ project_name }}"

    - name: Create a new decision environment
      ansible.eda.decision_environment:
        name: "{{ decision_env_name }}"
        image_url: "{{ de_image_url }}"
        organization_name: "{{ organization_name }}"

    - name: Enable an activation that does not exist, without its definition
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        organization_name: "{{ organization_name }}"
        state: enabled
      register: result
      ignore_errors: true

    - name: Check that the missing definition is reported
      ansible.builtin.assert:
        that:
          - result.failed
          - "'does not exist' in result.msg"
          - "'project_name, rulebook_name, decision_environment_name' in result.msg"

    - name: Create a disabled activation
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
        state: disabled
      register: result

    - name: Get information about the disabled activation
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"
      register: activation_status

    - name: Check that the activation was created disabled
      ansible.builtin.assert:
        that:
          - result.changed
          - not activation_status.activations[0].is_enabled

    - name: Enable the activation
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        state: enabled

    - name: Wait for the activation to be running
      register: activation_status
      until: activation_status.activations[0].status == "running"
      retries: 30
      delay: 2
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"

    - name: Disable the running activation
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        state: disabled

    - name: Enable the activation again while it is stopping
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        state: enabled
      register: result

    - name: Check that the activation was enabled
      ansible.builtin.assert:
        that:
          - result.changed

    - name: Wait for the activation to be running
      register: activation_status
      until: activation_status.activations[0].status == "running"
      retries: 30
      delay: 2
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"

    - name: Disable the running activation
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        state: disabled

    - name: Update the activation while it is stopping
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        description: "Updated while stopping"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
      register: result

    - name: Get information about the updated activation
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"
      register: activation_status

    - name: Check that the activation was updated and enabled
      ansible.builtin.assert:
        that:
          - result.changed
          - activation_status.activations[0].description == "Updated while stopping"
          - activation_status.activations[0].is_enabled

    - name: Wait for the activation to be running
      register: activation_status
      until: activation_status.activations[0].status == "running"
      retries: 30
      delay: 2
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"

    - name: Disable the running activation and update its definition
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        description: "Updated while disabling"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
        state: disabled
      register: result

    - name: Get information about the disabled activation
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"
      register: activation_status

    - name: Check that the activation was disabled and updated
      ansible.builtin.assert:
        that:
          - result.changed
          - activation_status.activations[0].description == "Updated while disabling"
          - not activation_status.activations[0].is_enabled

    - name: Disable the activation with the same definition again
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        description: "Updated while disabling"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
        state: disabled
      register: result

    - name: Check that the activation was not changed
      ansible.builtin.assert:
        that:
          - not result.changed

    - name: Update the definition of the disabled activation
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        description: "Updated while disabled"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
        state: disabled
      register: result

    - name: Get information about the disabled activation
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"
      register: activation_status

    - name: Check that the activation was updated and is still disabled
      ansible.builtin.assert:
        that:
          - result.changed
          - activation_status.activations[0].description == "Updated while disabled"
          - not activation_status.activations[0].is_enabled

    - name: Enable the disabled activation and update its definition
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        description: "Updated while enabling"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
        state: enabled
      register: result

    - name: Wait for the activation to be running
      register: activation_status
      until: activation_status.activations[0].status == "running"
      retries: 30
      delay: 2
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"

    - name: Check that the activation was updated and started
      ansible.builtin.assert:
        that:
          - result.changed
          - activation_status.activations[0].description == "Updated while enabling"
          - activation_status.activations[0].is_enabled

    - name: Enable the running activation with the same definition again
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        description: "Updated while enabling"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
        state: enabled
      register: result

    - name: Check that the activation was not changed
      ansible.builtin.assert:
        that:
          - not result.changed

    - name: Record the restart count of the running activation
      set_fact:
        restart_count: "{{ activation_status.activations[0].restart_count }}"

    - name: Enable the running activation with a changed definition
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        description: "Not applied while running"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
        state: enabled
      register: result

    - name: Get information about the running activation
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"
      register: activation_status

    - name: Check that the running activation was not restarted or changed
      ansible.builtin.assert:
        that:
          - not result.changed
          - activation_status.activations[0].description == "Updated while enabling"
          - activation_status.activations[0].restart_count == restart_count | int

    - name: Apply the definition with the deprecated enabled option set to false
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
        description: "Updated while enabling"
        enabled: false
      register: result

    - name: Get information about the activation
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"
      register: activation_status

    - name: Check that the activation was disabled
      ansible.builtin.assert:
        that:
          - result.changed
          - not activation_status.activations[0].is_enabled

    - name: Apply the same definition with enabled set to false again
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        project_name: "{{ project_name }}"
        rulebook_name: "{{ rulebook_name }}"
        decision_environment_name: "{{ decision_env_name }}"
        organization_name: "{{ organization_name }}"
        description: "Updated while enabling"
        enabled: false
      register: result

    - name: Check that the activation was not changed
      ansible.builtin.assert:
        that:
          - not result.changed

  always:
    - name: Delete rulebook activation
      ansible.eda.rulebook_activation:
        name: "{{ activation_name }}"
        state: absent
      ignore_errors: true

    - name: Wait for the activation to be deleted
      ansible.eda.rulebook_activation_info:
        name: "{{ activation_name }}"
      register: activation_status
      until: activation_status.activations | length == 0
      retries: 30
      delay: 2
      ignore_errors: true

    - name: Delete project
      ansible.eda.project:
        name: "{{ project_name }}"
        state: absent
      ignore_errors: true

    - name: Delete decision environment
      ansible.eda.decision_environment:
        name: "{{ decision_env_name }}"
        state: absent
      ignore_errors: true
